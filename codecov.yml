# Two suites are measured: the Go API and the frontend JS.
#
# Each has ONE number, and the authoritative, build-failing copy of each lives
# in the script CI and scripts/check.sh both call — scripts/coverage-gate.sh
# for Go, scripts/js-coverage-report.mjs for JS. The targets here drive
# codecov's PR status checks; keep them in sync with those scripts. This repo
# previously carried an aspirational 80% in .coverage-thresholds.json against a
# 40% patch target here, with neither enforcing anything.
#
# Measured when set (2026-07-30): Go 74.7%, JS 44.57%. Ratchet only.
#
# Note the JS number covers only files a test actually imports — V8 does not
# instrument unimported modules, so 58 of 122 src files are absent from it
# entirely. js-coverage-report.mjs ratchets that count separately; codecov
# cannot see it.
coverage:
  status:
    project:
      backend:
        target: 70%
        threshold: 2%
        flags:
          - unittests
      frontend:
        target: 44%
        threshold: 2%
        flags:
          - frontend
    patch:
      backend:
        target: 70%
        threshold: 2%
        flags:
          - unittests
      frontend:
        target: 44%
        threshold: 2%
        flags:
          - frontend

flags:
  unittests:
    paths:
      - api/
  frontend:
    paths:
      - frontend/src/

# cmd/seed is a standalone stress-test data generator, not shipped app code —
# it has its own main() and writes raw batched INSERTs. Not worth unit tests.
# scripts/coverage-gate.sh mirrors this list in IGNORE_RE.
ignore:
  - "api/cmd/seed"
