name: Tests

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

# A new push supersedes the run for the previous one; finishing it only delays
# the run that matters.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      # Every check below is a `scripts/check.sh --only <step>` call, so CI and
      # the local gate run the same commands and cannot drift. Under GitHub
      # Actions check.sh streams each step's output instead of only logging it.
      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Pinned for reproducible CI; the action downloads the release binary
          # rather than compiling it. Keep in sync with local tooling —
          # scripts/doctor.sh reads this line.
          version: v2.12.2
          install-only: true
          # The action's schema check of .golangci.yml is not part of the gate
          # (and the config does not pass it).
          verify: false

      # No build tags. Integration test files are constrained with
      # `//go:build !unit`, so the default build already includes them — it is
      # `-tags=unit` that excludes them, and no file in this repo declares an
      # `integration` tag.
      - name: Go lint
        run: ./scripts/check.sh --only go-lint

  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      # The E2E step builds the Go backend; without a warm build cache that
      # compile is most of the step.
      - name: Set up Go
        id: go
        uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
          # Cached per job in the next step. setup-go keys its cache on go.sum
          # alone, so every job shares one entry and the first to finish saves
          # it — lint or govulncheck, which compile nothing, leaving the jobs
          # that do build to start from a cold build cache.
          cache: false

      - name: Go cache
        uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ github.job }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('api/go.sum') }}
          restore-keys: go-${{ github.job }}-${{ steps.go.outputs.go-version }}-

      # run-e2e.sh runs `playwright install chromium`, a no-op when the browser
      # for this playwright-core version is already on disk.
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/playwright-core'].version")" >> "$GITHUB_OUTPUT"

      - name: Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.playwright.outputs.version }}

      - name: Install npm dependencies
        run: npm ci --no-audit --no-fund

      # Each step is `scripts/check.sh --only <step>`; what the step runs, and
      # why, is documented on its function there.
      - name: JS lint
        run: ./scripts/check.sh --only js-lint

      - name: JS typecheck
        run: ./scripts/check.sh --only js-typecheck

      - name: html escaping
        run: ./scripts/check.sh --only html-escaping

      - name: Vendored TT sinks
        run: ./scripts/check.sh --only vendor-sinks

      - name: E2E tests
        run: ./scripts/check.sh --only e2e

      - name: JS tests
        run: ./scripts/check.sh --only js-test

      - name: Frontend coverage floor
        run: ./scripts/check.sh --only js-coverage

      - name: Upload frontend coverage
        uses: codecov/codecov-action@v7
        with:
          file: coverage-frontend.lcov
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          flags: frontend
          name: codecov-frontend

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # Tracks api/go.mod like every other job, with check-latest so the
          # newest patch release is resolved rather than the runner's cached
          # one: govulncheck resolves Go stdlib symbols from the toolchain in
          # use, so an older patch level here would re-flag stdlib vulns
          # already fixed upstream.
          go-version-file: api/go.mod
          check-latest: true
          cache-dependency-path: api/go.sum

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

      - name: Run govulncheck
        run: ./scripts/check.sh --only govulncheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        id: go
        uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
          # Cached per job in the next step. setup-go keys its cache on go.sum
          # alone, so every job shares one entry and the first to finish saves
          # it — lint or govulncheck, which compile nothing, leaving the jobs
          # that do build to start from a cold build cache.
          cache: false

      - name: Go cache
        uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ github.job }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('api/go.sum') }}
          restore-keys: go-${{ github.job }}-${{ steps.go.outputs.go-version }}-

      - name: Build CSS bundles
        run: chmod +x scripts/build-css.sh && ./scripts/build-css.sh

      # sqlc is optional for contributors (the generated code is committed), so
      # the script skips its regeneration check when the binary is absent. CI is
      # where that skip must not happen — installing it here is what makes the
      # committed models a checked fact rather than a convention. The release
      # binary, not `go install`, which compiled sqlc from source on every run.
      - name: Install sqlc
        uses: sqlc-dev/setup-sqlc@v5
        with:
          sqlc-version: "1.31.1"

      - name: SQL layer
        run: ./scripts/check.sh --only sql-layer

      # check.sh's go-vet step is not repeated here: golangci-lint in the lint
      # job runs govet (api/.golangci.yml, `default: standard`).
      - name: Run Go tests
        # The integration suite runs by default and requires a functioning
        # SQLite environment (which ubuntu-latest provides). -count=1 because
        # the Go cache restored above also holds test results: without it an
        # unchanged package reports "(cached)" and its tests never run.
        env:
          GOFLAGS: -count=1
        run: ./scripts/check.sh --only go-test

      # The build-failing half of the coverage gate. codecov's status checks
      # only report; this is what actually turns the job red.
      - name: Coverage floor
        run: ./scripts/check.sh --only go-coverage

      - name: Upload coverage reports
        uses: codecov/codecov-action@v7
        with:
          file: api/coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          flags: unittests
          name: codecov-go

  # One image build serves both smoke checks: the bare container and the
  # quickstart wizard. The job keeps the docker-smoke name because the develop
  # ruleset requires that check.
  #
  # The quickstart wizard is the largest bespoke-shell surface in the repo and
  # has to keep working against every release, but nothing exercised it — a
  # broken installer would only show up as a user report. The second half of
  # this job drives its non-interactive Docker path end to end against the
  # locally built image.
  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Shellcheck the wizard
        run: shellcheck quickstart/install.sh quickstart/uninstall.sh quickstart/update.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --test rewrites the compose file to localhost/point:dev, so the wizard
      # runs against the code in this checkout rather than the published
      # release. Its own cache scope: dev-image.yml builds two platforms and
      # would otherwise overwrite this one's cache index.
      - name: Build image as point:smoke and localhost/point:dev
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/Dockerfile
          push: false
          load: true
          tags: |
            point:smoke
            localhost/point:dev
          cache-from: type=gha,scope=smoke
          cache-to: type=gha,scope=smoke,mode=max

      - name: Start container and verify /health
        run: |
          mkdir -p /tmp/point-smoke && chmod 777 /tmp/point-smoke
          docker run -d --name point-smoke -p 8000:8000 \
            -e DATABASE_URL=/data/point.db \
            -e STORAGE_PATH=/data \
            -e TELEGRAM_TOKEN="${TELEGRAM_TOKEN:-}" \
            -e NOTIFY_TELEGRAM_CHAN="${NOTIFY_TELEGRAM_CHAN:-}" \
            -e NOTIFY_ADMINS="${NOTIFY_ADMINS:-}" \
            -v /tmp/point-smoke:/data \
            point:smoke
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8000/health; then
              echo "Health check passed"
              break
            fi
            sleep 2
          done
          curl -sf http://localhost:8000/health || (docker logs point-smoke && exit 1)

      - name: Cleanup
        if: always()
        run: docker rm -f point-smoke || true

      - name: Run the installer non-interactively
        working-directory: quickstart
        # install.sh's own wait_for_health polls /health for 60s and exits
        # non-zero on timeout, so a wizard that starts nothing fails here.
        run: bash install.sh --method=docker --auto --test

      - name: Verify --test used the locally built image
        working-directory: quickstart
        # Guards the bug this job was written against: --test used to sed the
        # image line, which never matched the ${IMAGE:-…} form, so the smoke
        # test would have silently exercised the published release.
        run: |
          set -euo pipefail
          grep -q '^IMAGE=localhost/point:dev$' .env
          docker compose config | grep -q 'image: localhost/point:dev' 

      - name: Verify the installed instance serves
        working-directory: quickstart
        run: |
          set -euo pipefail
          curl -fsS http://localhost:8001/health | tee /dev/stderr | grep -q '"status":"ok"'
          # The setup wizard must be reachable on a fresh install — a container
          # that boots but cannot be set up is not a working install.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8001/api/setup/status)" = "200"

      - name: Container logs on failure
        if: failure()
        working-directory: quickstart
        run: docker compose logs || true

      - name: Uninstall cleanly
        working-directory: quickstart
        run: |
          set -euo pipefail
          docker compose down -v
          # The uninstaller ships alongside and is equally untested; at minimum
          # it must parse and its --help must succeed.
          bash uninstall.sh --help >/dev/null

  # Instructions rot silently. AGENTS.md used to tell agents to ALWAYS build the
  # tests with -tags=integration and warned that a bare `go test ./...` skipped
  # them — both false for as long as the `//go:build !unit` convention has been
  # in place, and nothing caught it. This job runs what the docs say to run.
  docs-commands:
    runs-on: ubuntu-latest
    steps:
      # Full history: ai-declaration.md's block counts commits and co-author
      # trailers, and on a shallow clone those commands do not run at all.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        id: go
        uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
          # Cached per job in the next step. setup-go keys its cache on go.sum
          # alone, so every job shares one entry and the first to finish saves
          # it — lint or govulncheck, which compile nothing, leaving the jobs
          # that do build to start from a cold build cache.
          cache: false

      - name: Go cache
        uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ github.job }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('api/go.sum') }}
          restore-keys: go-${{ github.job }}-${{ steps.go.outputs.go-version }}-

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      # ./scripts/run.sh is the first command AGENTS.md and CONTRIBUTING.md give
      # a newcomer, and the one command the runner below cannot execute: it
      # serves until interrupted. It runs first, on an untouched checkout, so
      # that the documented promises are tested as stated — no configuration, no
      # prior build, port 8001, and loopback unless LOCAL_RUN says otherwise.
      - name: Dev server smoke (./scripts/run.sh)
        run: |
          set -euo pipefail
          ./scripts/run.sh > /tmp/run-sh.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:8001/health >/dev/null && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8001/health | tee /dev/stderr | grep -q '"status":"ok"'
          # A fresh clone must reach the setup wizard; a server that boots into
          # nothing you can set up is not a working dev loop.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8001/api/setup/status)" = "200"
          pkill -f '^\./point$' || true

      - name: Dev server log on failure
        if: failure()
        run: cat /tmp/run-sh.log || true

      # The runner, doctor.sh and check.sh — pure shell with no test suite of
      # their own, and check.sh drives every check in this workflow — plus the
      # two release-path scripts, which only execute on a tag, so a syntax
      # error in them would otherwise surface as a broken release rather than
      # a failed PR.
      - name: Shellcheck the runner
        run: shellcheck scripts/check-docs.sh scripts/doctor.sh scripts/check.sh scripts/build-tarball.sh scripts/release-notes.sh

      # Extracts the fenced bash blocks and the AGENTS.md command table from the
      # documented set and runs them. Anything that cannot run unattended
      # carries a `<!-- verify:skip … -->` marker in the doc itself.
      # GOFLAGS=-count=1: the Go cache restored above also holds test results,
      # and a documented `go test` answered from it has not run anything.
      - name: Run every documented command
        env:
          GOFLAGS: -count=1
        run: ./scripts/check-docs.sh
