name: Tests

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - name: Install golangci-lint
        # Pinned for reproducible CI; note the /v2 module path — the bare path
        # installs the abandoned v1 line. Keep in sync with local tooling.
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2

      - name: golangci-lint
        # No build tags, matching scripts/check.sh. Integration test files are
        # constrained with `//go:build !unit`, so the default build already
        # includes them — it is `-tags=unit` that excludes them, and no file in
        # this repo declares an `integration` tag.
        run: golangci-lint run --timeout=5m
        working-directory: api

  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      # Uses the lockfile-pinned eslint (flat config). Keep the file list in
      # sync with scripts/check.sh — the 614-line service worker and the
      # build scripts are lintable code too.
      - name: JS lint
        run: |
          npm ci --no-audit --no-fund
          node_modules/.bin/eslint frontend/src frontend/sw.js scripts/*.mjs

      # The JSDoc annotations in frontend/src are checked, not decorative:
      # jsconfig.json sets checkJs, and the files not yet clean carry
      # `// @ts-nocheck` on line 1. Same command as scripts/check.sh.
      - name: JS typecheck
        run: npm run typecheck

      # Coverage rides along on the same run (V8 instrumentation via the
      # built-in runner — no c8, no extra devDependency).
      - name: E2E tests
        run: ./scripts/run-e2e.sh


      - name: JS tests
        run: |
          node --test --experimental-test-coverage \
            --test-coverage-include='frontend/src/**' \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=lcov --test-reporter-destination=coverage-frontend.lcov \
            frontend/test/*.test.js

      - name: Frontend coverage floor
        run: node scripts/js-coverage-report.mjs coverage-frontend.lcov

      - name: Upload frontend coverage
        uses: codecov/codecov-action@v7
        with:
          file: coverage-frontend.lcov
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          flags: frontend
          name: codecov-frontend

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # Tracks api/go.mod like every other job, with check-latest so the
          # newest patch release is resolved rather than the runner's cached
          # one: govulncheck resolves Go stdlib symbols from the toolchain in
          # use, so an older patch level here would re-flag stdlib vulns
          # already fixed upstream.
          go-version-file: api/go.mod
          check-latest: true
          cache-dependency-path: api/go.sum

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...
        working-directory: api

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - name: Build CSS bundles
        run: chmod +x scripts/build-css.sh && ./scripts/build-css.sh

      # sqlc is optional for contributors (the generated code is committed), so
      # the script skips its regeneration check when the binary is absent. CI is
      # where that skip must not happen — installing it here is what makes the
      # committed models a checked fact rather than a convention.
      - name: Install sqlc
        run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1

      - name: SQL layer
        run: ./scripts/check-sql-layer.sh

      - name: Run Go tests
        # The integration suite runs by default and requires a functioning
        # SQLite environment (which ubuntu-latest provides).
        run: |
          cd api
          go test ./... -coverprofile=coverage.txt -covermode=atomic

      # The build-failing half of the coverage gate. codecov's status checks
      # only report; this is what actually turns the job red.
      - name: Coverage floor
        run: ./scripts/coverage-gate.sh api/coverage.txt

      - name: Upload coverage reports
        uses: codecov/codecov-action@v7
        with:
          file: api/coverage.txt
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          flags: unittests
          name: codecov-go

  docker-smoke:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/Dockerfile
          push: false
          load: true
          tags: point:smoke

      - name: Start container and verify /health
        run: |
          mkdir -p /tmp/point-smoke && chmod 777 /tmp/point-smoke
          docker run -d --name point-smoke -p 8000:8000 \
            -e DATABASE_URL=/data/point.db \
            -e STORAGE_PATH=/data \
            -e TELEGRAM_TOKEN="${TELEGRAM_TOKEN:-}" \
            -e NOTIFY_TELEGRAM_CHAN="${NOTIFY_TELEGRAM_CHAN:-}" \
            -e NOTIFY_ADMINS="${NOTIFY_ADMINS:-}" \
            -v /tmp/point-smoke:/data \
            point:smoke
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8000/health; then
              echo "Health check passed"
              break
            fi
            sleep 2
          done
          curl -sf http://localhost:8000/health || (docker logs point-smoke && exit 1)

      - name: Cleanup
        if: always()
        run: docker rm -f point-smoke || true

  # The quickstart wizard is the largest bespoke-shell surface in the repo and
  # has to keep working against every release, but nothing exercised it — a
  # broken installer would only show up as a user report. This drives its
  # non-interactive Docker path end to end against a locally built image.
  quickstart-smoke:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Shellcheck the wizard
        run: shellcheck quickstart/install.sh quickstart/uninstall.sh quickstart/update.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --test rewrites the compose file to this exact tag, so the wizard runs
      # against the code in this checkout rather than the published release.
      - name: Build image as localhost/point:dev
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/Dockerfile
          push: false
          load: true
          tags: localhost/point:dev

      - name: Run the installer non-interactively
        working-directory: quickstart
        # install.sh's own wait_for_health polls /health for 60s and exits
        # non-zero on timeout, so a wizard that starts nothing fails here.
        run: bash install.sh --method=docker --auto --test

      - name: Verify --test used the locally built image
        working-directory: quickstart
        # Guards the bug this job was written against: --test used to sed the
        # image line, which never matched the ${IMAGE:-…} form, so the smoke
        # test would have silently exercised the published release.
        run: |
          set -euo pipefail
          grep -q '^IMAGE=localhost/point:dev$' .env
          docker compose config | grep -q 'image: localhost/point:dev' 

      - name: Verify the installed instance serves
        working-directory: quickstart
        run: |
          set -euo pipefail
          curl -fsS http://localhost:8001/health | tee /dev/stderr | grep -q '"status":"ok"'
          # The setup wizard must be reachable on a fresh install — a container
          # that boots but cannot be set up is not a working install.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8001/api/setup/status)" = "200"

      - name: Container logs on failure
        if: failure()
        working-directory: quickstart
        run: docker compose logs || true

      - name: Uninstall cleanly
        working-directory: quickstart
        run: |
          set -euo pipefail
          docker compose down -v
          # The uninstaller ships alongside and is equally untested; at minimum
          # it must parse and its --help must succeed.
          bash uninstall.sh --help >/dev/null

  # Instructions rot silently. AGENTS.md used to tell agents to ALWAYS build the
  # tests with -tags=integration and warned that a bare `go test ./...` skipped
  # them — both false for as long as the `//go:build !unit` convention has been
  # in place, and nothing caught it. This job runs what the docs say to run.
  docs-commands:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      # Full history: ai-declaration.md's block counts commits and co-author
      # trailers, and on a shallow clone those commands do not run at all.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      # ./scripts/run.sh is the first command AGENTS.md and CONTRIBUTING.md give
      # a newcomer, and the one command the runner below cannot execute: it
      # serves until interrupted. It runs first, on an untouched checkout, so
      # that the documented promises are tested as stated — no configuration, no
      # prior build, port 8001, and loopback unless LOCAL_RUN says otherwise.
      - name: Dev server smoke (./scripts/run.sh)
        run: |
          set -euo pipefail
          ./scripts/run.sh > /tmp/run-sh.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:8001/health >/dev/null && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8001/health | tee /dev/stderr | grep -q '"status":"ok"'
          # A fresh clone must reach the setup wizard; a server that boots into
          # nothing you can set up is not a working dev loop.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8001/api/setup/status)" = "200"
          pkill -f '^\./point$' || true

      - name: Dev server log on failure
        if: failure()
        run: cat /tmp/run-sh.log || true

      # The runner and doctor.sh — both are pure shell with no test suite of
      # their own — plus the two release-path scripts, which only execute on a
      # tag, so a syntax error in them would otherwise surface as a broken
      # release rather than a failed PR.
      - name: Shellcheck the runner
        run: shellcheck scripts/check-docs.sh scripts/doctor.sh scripts/build-tarball.sh scripts/release-notes.sh

      # Extracts the fenced bash blocks and the AGENTS.md command table from the
      # documented set and runs them. Anything that cannot run unattended
      # carries a `<!-- verify:skip … -->` marker in the doc itself.
      - name: Run every documented command
        run: ./scripts/check-docs.sh
